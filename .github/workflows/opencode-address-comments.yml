name: opencode-address-comments

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Early exit if another run is active
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ACTIVE=$(gh api repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/runs \
            --jq ".workflow_runs[?select(.id != ${RUN_ID})] | [.[] | select(.status == \"in_progress\" or .status == \"queued\")] | length")
          if [ "$ACTIVE" -gt 0 ]; then
            echo "::notice::Another run is already processing PR #$PR_NUMBER. Exiting early."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Run opencode
        uses: anomalyco/opencode/github@v1.18.16
        env:
          GITHUB_TOKEN: ${{ github.token }}

        with:
          model: lmstudio/qwen3.6-27b-uncensored-mtp
          use_github_token: true
          prompt: |
            Read this pull request comment and implement the suggestion in the codebase.
            This is a multi-module Maven project (rest-service, kafka-consumer). Use `mvn clean compile` to verify changes compile correctly across all modules.
            If no changes are currently pending, do not post a new comment.
            If the comment is not a suggestion, respond with an emoji reaction acknowledging the comment.

      - name: Cleanup Comments
        uses: ./.github/actions/cleanup-comments
        with:
          token: ${{ github.token }}
          mode: outdated
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          body-pattern: 'All changes compile|All .* suggestion|Changes Summary|PR Review|Bug fixes implemented|## |No action needed'

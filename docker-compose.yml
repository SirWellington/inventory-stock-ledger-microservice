version: '3.8'

# Environment Variables
# DEFINE THESE IN A .env FILE IN THE ROOT OF THE PROJECT
# ------------------------------------------------------
# DATABASE_USERNAME=your_database_username
# DATABASE_PASSWORD=your_database_password
# DATABASE_PORT=default_postgres_port (e.g., 5432)
# KAFKA_PORT=default_kafka_port (e.g., 9092)

services:
  # Local PostgreSQL Database for Stock Ledger & Inventory Data
  postgres:
    image: postgres:15-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: stock_ledger_db
    ports:
      - "${DATABASE_PORT}:{DATABASE_PORT}"

  # Local Kafka Broker for Event-Driven Processing (WCA & Inventory Updates)
  kafka:
    image: bitnami/kafka:latest
    container_name: inventory-kafka
    depends_on:
      - postgres
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      # KRaft mode configuration (No Zookeeper required for local dev)
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:${KAFKA_PORT},CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:{KAFKA_PORT}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
# Environment Variables
# DEFINE THESE IN A .env FILE IN THE ROOT OF THE PROJECT
# ------------------------------------------------------
# DATABASE_USERNAME=your_database_username
# DATABASE_PASSWORD=your_database_password
# DATABASE_PORT=default_postgres_port (e.g., 5432)
# KAFKA_PORT=default_kafka_port (e.g., 9092)

services:
  # Local PostgreSQL Database for Stock Ledger & Inventory Data
  postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: inventory_ledger_db
    mem_limit: 4G
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Local Kafka Broker for Event-Driven Processing (WCA & Inventory Updates)
  kafka:
    image: apache/kafka:latest
    container_name: inventory-kafka
    depends_on:
      - postgres
    mem_limit: 3G
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    volumes:
      - kafka-data:/bitnami/kafka
    environment:
      # KRaft mode configuration (No Zookeeper required for local dev)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  # Visual Dashboard for Kafka (Optional but highly recommended)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: inventory-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:${KAFKA_UI_PORT}"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_PORT}

volumes:
  postgres-data:
    driver: local
  kafka-data:
    driver: local